name: release

# Publica las imagenes a GHCR cuando Diego corta un tag v* (versionado-conservador).
# workflow_dispatch permite una corrida manual (empuja solo las etiquetas flotantes).
# Cada version dice que cambia: el tag tiene que coincidir con pyproject.toml y la version
# tiene que tener su seccion en CHANGELOG.md, si no no se publica nada. Con el tag, ademas,
# se crea el Release vX.Y.Z con esas notas.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # El package `anonimal` lo ocupa la imagen vieja (embebido) y su ACL no deja
  # escribir a este repo. Publicamos como `anonimal-svc` (lo crea este repo).
  # Consolidar a `anonimal` = borrar el package viejo y renombrar acá.
  IMAGE: ghcr.io/diegoparras/anonimal-svc

jobs:
  notas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version y novedades (pyproject.toml + CHANGELOG)
        id: ver
        run: |
          V="$(python3 -m app.novedades --version)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la version de pyproject.toml ($V)."
            exit 1
          fi
          python3 -m app.novedades notas > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Anonimal v$V"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"

  lite:
    needs: notas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      V: ${{ needs.notas.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build imagen lite
        run: docker build -f Dockerfile.lite --label "org.opencontainers.image.version=$V" -t "$IMAGE:lite" .

      - name: Smoke del contenedor
        run: |
          docker run -d --name anonimal_smoke -p 8920:8000 "$IMAGE:lite"
          pip install httpx
          SMOKE_URL=http://127.0.0.1:8920 python scripts/smoke.py
          docker logs anonimal_smoke 2>&1 | sed -n 2p | grep -q "^\[anonimal\] ANONIMAL v$V"
          docker rm -f anonimal_smoke

      - name: Trivy (gate antes de publicar)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:lite
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push lite
        run: |
          docker push "$IMAGE:lite"
          if [ -n "${{ steps.v.outputs.ver }}" ]; then
            docker tag "$IMAGE:lite" "$IMAGE:${{ steps.v.outputs.ver }}-lite"
            docker push "$IMAGE:${{ steps.v.outputs.ver }}-lite"
          fi

  full:
    needs: notas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      V: ${{ needs.notas.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espacio en disco (la imagen full es pesada)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build imagen full (ML)
        run: docker build --label "org.opencontainers.image.version=$V" -t "$IMAGE:latest" .

      - name: Trivy (gate antes de publicar)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push full
        run: |
          docker push "$IMAGE:latest"
          if [ -n "${{ steps.v.outputs.ver }}" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${{ steps.v.outputs.ver }}"
            docker push "$IMAGE:${{ steps.v.outputs.ver }}"
          fi

  release:
    # Solo con tag: el Release vX.Y.Z con las notas de esa version del CHANGELOG.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [notas, lite, full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release de la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.notas.outputs.version }}
        run: |
          python3 -m app.novedades notas > "$RUNNER_TEMP/notas.md"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya tenia Release: este tag no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --verify-tag --title "Anonimal v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
